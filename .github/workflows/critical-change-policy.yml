name: ZANA Critical Change Policy

on:
  pull_request_target:
    branches: ["main"]
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  protect-critical-paths:
    name: Protect Finalized Critical Paths
    runs-on: ubuntu-latest
    steps:
      - name: Enforce explicit approval for critical changes
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              { owner, repo, pull_number, per_page: 100 }
            );

            const criticalExact = new Set([
              '.github/workflows/ci.yml',
              '.github/workflows/finalization-contract.yml',
              '.github/workflows/critical-change-policy.yml',
              'scripts/smoke-test.js',
              'scripts/verify-finalization-contract.js',
              'wrangler.jsonc',
              'package.json',
              'firebase.json',
              '.firebaserc',
              'src/server/config/aiModels.ts',
              'src/constitutions/ai.constitution.ts'
            ]);

            const criticalPrefixes = [
              'src/worker/',
              'src/server/ai/',
              '.github/workflows/'
            ];

            const changedCritical = files
              .map(file => file.filename)
              .filter(path => criticalExact.has(path) || criticalPrefixes.some(prefix => path.startsWith(prefix)));

            const labels = new Set((context.payload.pull_request.labels || []).map(label => label.name));
            const approved = labels.has('finalization-approved');

            core.info(`Changed critical files: ${changedCritical.length ? changedCritical.join(', ') : 'none'}`);

            if (changedCritical.length > 0 && !approved) {
              core.setFailed(
                'Critical finalized production files changed without the finalization-approved label. ' +
                'Owner review and explicit approval are required before merge.'
              );
            }

            const forbiddenDeletions = new Set([
              '.github/workflows/finalization-contract.yml',
              'scripts/verify-finalization-contract.js',
              'docs/production-finalization.md'
            ]);

            const deletedProtected = files
              .filter(file => file.status === 'removed' && forbiddenDeletions.has(file.filename))
              .map(file => file.filename);

            if (deletedProtected.length > 0) {
              core.setFailed(`Protected finalization files may not be deleted: ${deletedProtected.join(', ')}`);
            }
