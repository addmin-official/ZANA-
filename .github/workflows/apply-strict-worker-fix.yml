name: Apply Strict Worker Patch

on:
  push:
    branches:
      - fix/zana-finalization-lockdown
    paths:
      - scripts/apply-strict-worker-fix.mjs
      - .github/workflows/apply-strict-worker-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/zana-finalization-lockdown
          fetch-depth: 0

      - name: Apply strict source patch
        run: node scripts/apply-strict-worker-fix.mjs

      - name: Validate patch formatting
        run: git diff --check

      - name: Commit patched sources
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/worker/index.ts src/screens/ProfileScreen.tsx
          if git diff --cached --quiet; then
            echo "No source changes were required."
            exit 0
          fi
          git commit -m "fix(types): validate Worker request contracts"
          git push origin HEAD:fix/zana-finalization-lockdown
