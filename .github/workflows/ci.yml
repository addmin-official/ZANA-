name: ZANA Finalization CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

concurrency:
  group: zana-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  statuses: write

jobs:
  validate:
    name: Validate, Test, Security and RTL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:architecture
      - run: npm run test:security
      - run: npm run test:rtl
      - name: Verify architecture and exposure boundaries
        run: |
          set -euo pipefail
          if git grep -nE 'firebase deploy|functions:deploy|hosting:deploy' -- ':!docs/**' ':!*.md'; then
            echo '::error::Firebase Hosting or Functions deployment command found.'
            exit 1
          fi
          if git grep -nE 'https://[^ ]*(web\.app|firebaseapp\.com)|localhost|127\.0\.0\.1' -- '.github/**' 'wrangler*.json*' 'src/**' ':!src/**/*.test.ts' ':!src/test/**'; then
            echo '::error::Forbidden production hosting or emulator routing reference found.'
            exit 1
          fi
          if git grep -nE 'GEMINI_API_KEY\s*[:=]\s*["'"'][^"'"']+["'"']|AIza[0-9A-Za-z_-]{20,}' -- ':!package-lock.json' ':!bun.lock'; then
            echo '::error::Potential secret exposure found.'
            exit 1
          fi
          git diff --check

  build:
    name: Build Client and Worker
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build client
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://zana-api-worker.zana-platform.workers.dev' }}
        run: npm run build:client
      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: zana-build
          path: dist/client

  deploy:
    name: Deploy Cloudflare Production
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: zana-build
          path: dist/client
      - name: Fail fast on mandatory secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROVIDER_PREFLIGHT_TOKEN: ${{ secrets.PROVIDER_PREFLIGHT_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for name in GEMINI_API_KEY PROVIDER_PREFLIGHT_TOKEN CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing mandatory production secret: ${name}"
              exit 1
            fi
          done
      - name: Resolve KV binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
        run: node scripts/resolve-kv.js
      - name: Upload Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROVIDER_PREFLIGHT_TOKEN: ${{ secrets.PROVIDER_PREFLIGHT_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY --config wrangler.production.json
          printf '%s' "$PROVIDER_PREFLIGHT_TOKEN" | npx wrangler secret put PROVIDER_PREFLIGHT_TOKEN --config wrangler.production.json
      - name: Deploy Worker and static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.production.json

  verify:
    name: Verify Production Provider and Exposure
    needs: deploy
    runs-on: ubuntu-latest
    environment: Production
    env:
      API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://zana-api-worker.zana-platform.workers.dev' }}
      FRONTEND_ORIGIN: ${{ secrets.ZANA_FRONTEND_ORIGIN || 'https://zana.krd' }}
      PROVIDER_PREFLIGHT_TOKEN: ${{ secrets.PROVIDER_PREFLIGHT_TOKEN }}
    steps:
      - name: Verify health and strict CORS
        run: |
          set -euo pipefail
          base="${API_BASE_URL%/}"
          headers=$(mktemp)
          body=$(mktemp)
          status=$(curl --silent --show-error --max-time 30 -H "Origin: $FRONTEND_ORIGIN" -D "$headers" -o "$body" -w '%{http_code}' "$base/api/health")
          test "$status" = "200"
          test "$(jq -r '.ok' "$body")" = "true"
          test "$(grep -i '^access-control-allow-origin:' "$headers" | awk -F': ' '{print $2}' | tr -d '\r')" = "$FRONTEND_ORIGIN"
      - name: Verify preflight is private
        run: |
          set -euo pipefail
          base="${API_BASE_URL%/}"
          status=$(curl --silent --show-error -o /dev/null -w '%{http_code}' "$base/api/provider/preflight")
          test "$status" = "404"
      - name: Verify authenticated provider preflight
        run: |
          set -euo pipefail
          base="${API_BASE_URL%/}"
          body=$(mktemp)
          status=$(curl --silent --show-error --max-time 45 \
            -H "Authorization: Bearer $PROVIDER_PREFLIGHT_TOKEN" \
            -o "$body" -w '%{http_code}' "$base/api/provider/preflight")
          cat "$body"
          test "$status" = "200"
          test "$(jq -r '.ok' "$body")" = "true"
          test "$(jq -r '.status' "$body")" = "healthy"
          test "$(jq -r 'has("model") or has("category") or has("error")' "$body")" = "false"

  smoke:
    name: Production Smoke Tests
    needs: verify
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run complete production smoke suite
        env:
          API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://zana-api-worker.zana-platform.workers.dev' }}
          ZANA_FRONTEND_ORIGIN: ${{ secrets.ZANA_FRONTEND_ORIGIN || 'https://zana.krd' }}
        run: npm run test:smoke

  release:
    name: Generate Release Metadata
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release metadata
        run: |
          mkdir -p release
          cat > release/metadata.json <<EOF
          {
            "commit": "${GITHUB_SHA}",
            "created_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "status": "ready",
            "frontend": "https://zana.krd",
            "runtime": "cloudflare-worker"
          }
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: zana-release-${{ github.sha }}
          path: release/metadata.json
